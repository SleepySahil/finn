name: Refresh snapshot
# After the close on trading days: rebuild public/snapshot and commit it. The host (Vercel)
# redeploys on the commit, so the app always has a fresh, real snapshot even if a data source
# refuses the host's IP at request time.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run ingest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Commit snapshot
        run: |
          git config user.name "finn-ingest"
          git config user.email "finn-ingest@users.noreply.github.com"
          git add public/snapshot
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +%F)"
          git push
